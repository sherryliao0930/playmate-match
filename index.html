<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>畢旅玩伴配對</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* ===== 版型：糖果色遊樂園。白底貼紙卡片＋粗黑描邊＋實心投影，上方三角彩旗。 ===== */
:root{
  --sky:#B8E6FF; --sky2:#E6F7FF; --ground:#FFF6E8;
  --bg:#EAF7FF; --surface:#FFFFFF; --surface-2:#FFF8EC;
  --ink:#2A2140; --ink-soft:#6B6189; --ink-faint:#9A92B4;
  --line:#2A2140;
  --red:#FF5B6E; --yellow:#FFC43D; --mint:#19BFA8; --grape:#8A6BE0; --blue:#2F9BE8; --orange:#FF8F3C; --pink:#FF7FB4;
  --nine:#1BAE6B; --jan:#2F9BE8;
  --ok:#17A06B; --bad:#E4466B;
  --sticker:0 4px 0 var(--line);
  --sticker-sm:0 3px 0 var(--line);
  --r:20px;
  --display:"Baloo 2","Noto Sans TC",system-ui,sans-serif;
  --body:"Noto Sans TC",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --sky:#2A2456; --sky2:#1C1838; --ground:#1C1838;
  --bg:#141029; --surface:#221C3E; --surface-2:#2A2350;
  --ink:#F4F0FF; --ink-soft:#BDB4DC; --ink-faint:#8A81AC;
  --line:#0C0918;
  --red:#FF7585; --yellow:#FFD166; --mint:#3FD7C0; --grape:#A78BFA; --blue:#5FB8F5; --orange:#FFA961; --pink:#FF9BC6;
  --nine:#3FD48C; --jan:#5FB8F5;
  --ok:#43D197; --bad:#FF7A9C;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --sky:#2A2456; --sky2:#1C1838; --ground:#1C1838;
  --bg:#141029; --surface:#221C3E; --surface-2:#2A2350;
  --ink:#F4F0FF; --ink-soft:#BDB4DC; --ink-faint:#8A81AC;
  --line:#0C0918;
  --red:#FF7585; --yellow:#FFD166; --mint:#3FD7C0; --grape:#A78BFA; --blue:#5FB8F5; --orange:#FFA961; --pink:#FF9BC6;
  --nine:#3FD48C; --jan:#5FB8F5;
  --ok:#43D197; --bad:#FF7A9C;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.65;font-size:15px;
  -webkit-text-size-adjust:100%;
  background-image:radial-gradient(circle at 12% 8%,rgba(255,196,61,.18) 0,transparent 22%),
                   radial-gradient(circle at 88% 4%,rgba(255,91,110,.16) 0,transparent 20%),
                   radial-gradient(circle at 50% 100%,rgba(25,191,168,.14) 0,transparent 32%);
  background-attachment:fixed;
}
.wrap{max-width:900px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 60px}
.wrap.wide{max-width:1200px}
h1,h2,h3,h4{font-family:var(--display);margin:0;line-height:1.3;text-wrap:balance;letter-spacing:.01em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;font-family:var(--body)}
:focus-visible{outline:3px dashed var(--grape);outline-offset:3px;border-radius:8px}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--surface-2);
  border:1px solid var(--ink-faint);border-radius:5px;padding:1px 5px;font-size:.88em}

/* ---- 彩旗 ---- */
.bunting{height:20px;display:flex;overflow:hidden;width:100%}
.bunting i{flex:1 1 24px;min-width:0;height:20px;clip-path:polygon(0 0,100% 0,50% 100%)}
.bunting i:nth-child(6n+1){background:var(--red)}
.bunting i:nth-child(6n+2){background:var(--yellow)}
.bunting i:nth-child(6n+3){background:var(--mint)}
.bunting i:nth-child(6n+4){background:var(--blue)}
.bunting i:nth-child(6n+5){background:var(--grape)}
.bunting i:nth-child(6n+6){background:var(--orange)}

/* ---- 標頭 ---- */
header.top{background:linear-gradient(170deg,var(--sky),var(--sky2));
  border:3px solid var(--line);border-radius:0 0 26px 26px;border-top:none;
  box-shadow:var(--sticker);padding:20px 22px 22px;position:relative;overflow:hidden}
header.top::after{content:"";position:absolute;right:-26px;bottom:-34px;width:150px;height:150px;
  border-radius:50%;background:rgba(255,255,255,.35)}
:root[data-theme="dark"] header.top::after{background:rgba(255,255,255,.05)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) header.top::after{background:rgba(255,255,255,.05)}}
.eyebrow{font-size:.76rem;letter-spacing:.1em;color:var(--ink-soft);font-weight:700}
h1{font-size:clamp(1.7rem,6vw,2.6rem);font-weight:800;margin-top:4px;position:relative;z-index:1}
h1 .ride{display:inline-block;animation:spin 9s linear infinite;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}
.lede{color:var(--ink-soft);margin-top:10px;max-width:60ch;position:relative;z-index:1;font-size:.95rem}
.parkline{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px;position:relative;z-index:1}
.parkpill{font-family:var(--display);font-weight:700;font-size:.9rem;padding:5px 15px;border-radius:999px;
  border:2.5px solid var(--line);box-shadow:var(--sticker-sm);background:var(--surface);color:var(--ink)}
.parkpill.n{background:#C8F5DE}.parkpill.j{background:#CDE9FF}
:root[data-theme="dark"] .parkpill.n{background:#15503A}
:root[data-theme="dark"] .parkpill.j{background:#17395C}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .parkpill.n{background:#15503A}
 :root:not([data-theme="light"]) .parkpill.j{background:#17395C}}

/* ---- 進度：小燈泡 ---- */
.rail{display:flex;gap:7px;align-items:center;justify-content:center;margin-block:18px 16px}
.rail i{width:13px;height:13px;border-radius:50%;background:var(--surface);
  border:2.5px solid var(--line);transition:.2s}
.rail i.on{background:var(--yellow);transform:scale(1.35)}
.rail i.done{background:var(--mint)}

/* ---- 卡片 ---- */
.card{background:var(--surface);border:3px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sticker);padding:20px;margin-bottom:18px}
.card.flat{box-shadow:none;background:var(--surface-2);border-width:2.5px;border-style:dashed}
.ticket{position:relative}
.ticket::before,.ticket::after{content:"";position:absolute;top:50%;width:18px;height:18px;
  background:var(--bg);border:3px solid var(--line);border-radius:50%;margin-top:-9px}
.ticket::before{left:-12px;clip-path:inset(0 0 0 50%)}
.ticket::after{right:-12px;clip-path:inset(0 50% 0 0)}
.steplabel{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;
  font-size:.86rem;background:var(--yellow);color:#2A2140;border:2.5px solid var(--line);
  border-radius:999px;padding:3px 14px 3px 4px;box-shadow:var(--sticker-sm)}
.steplabel span.num{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;
  background:var(--line);color:#fff;font-size:.8rem}
h2.q{font-size:1.35rem;font-weight:800;margin-top:12px}
.hint{color:var(--ink-soft);font-size:.9rem;margin-top:7px}

/* ---- 名字格 ---- */
.namegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:9px;margin-top:16px}
.nb{display:flex;align-items:center;gap:7px;background:var(--surface-2);border:2.5px solid var(--line);
  border-radius:13px;padding:9px 9px;text-align:left;box-shadow:var(--sticker-sm);transition:.12s;min-width:0}
.nb:hover{transform:translateY(-2px);box-shadow:0 5px 0 var(--line)}
.nb:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.nb .seat{font-family:var(--display);font-weight:700;font-size:.74rem;background:var(--line);color:#fff;
  border-radius:7px;padding:0 6px;flex:none}
.nb .nm{font-weight:500;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nb[aria-pressed="true"]{background:var(--yellow)}
.nb[disabled]{opacity:.35;cursor:not-allowed}

/* ---- 膽量 ---- */
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-top:18px}
.cg{border:2.5px solid var(--line);background:var(--surface-2);border-radius:16px;padding:12px 3px;
  text-align:center;box-shadow:var(--sticker-sm);transition:.12s}
.cg:hover{transform:translateY(-2px)}
.cg .face{font-size:1.7rem;line-height:1.1}
.cg .lab{font-size:.74rem;color:var(--ink-soft);margin-top:4px;font-weight:600}
.cg[aria-pressed="true"]{background:var(--yellow)}
.cg[aria-pressed="true"] .lab{color:#2A2140}

/* ---- 類型卡 ---- */
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:12px;margin-top:16px}
.cat{border:3px solid var(--line);background:var(--surface-2);border-radius:18px;padding:14px;
  text-align:left;box-shadow:var(--sticker-sm);transition:.12s;min-width:0;display:flex;flex-direction:column;gap:7px;
  position:relative;overflow:hidden}
.cat::before{content:"";position:absolute;inset:0 0 auto 0;height:7px;background:var(--ccol)}
.cat:hover{transform:translateY(-3px);box-shadow:0 6px 0 var(--line)}
.cat .ctop{display:flex;align-items:center;gap:10px;margin-top:4px}
.cat .emo{font-size:1.8rem;flex:none;filter:drop-shadow(0 2px 0 rgba(0,0,0,.12))}
.cat .cname{font-family:var(--display);font-weight:800;font-size:1.12rem}
.cat .csub{font-size:.75rem;color:var(--ink-faint);font-weight:700;letter-spacing:.04em}
.cat .cdesc{font-size:.87rem;color:var(--ink-soft)}
.cat .ex{font-size:.79rem;color:var(--ink-faint);border-top:2px dotted var(--ink-faint);padding-top:8px;margin-top:2px}
.cat .ex b{color:var(--ccol);font-weight:800}
.cat[aria-pressed="true"]{background:var(--surface);
  box-shadow:0 6px 0 var(--line),inset 0 0 0 4px var(--ccol)}
.cat .tick{position:absolute;top:12px;right:10px;width:26px;height:26px;border-radius:50%;
  background:var(--ccol);border:2.5px solid var(--line);color:#fff;display:none;
  place-items:center;font-size:.9rem;font-weight:800}
.cat[aria-pressed="true"] .tick{display:grid}

/* ---- 玩伴貼紙 ---- */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{border:2.5px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 14px;
  font-size:.92rem;font-weight:500;box-shadow:var(--sticker-sm);transition:.12s;display:flex;gap:6px;align-items:center}
.chip:hover{transform:translateY(-2px)}
.chip .s{font-size:.72rem;font-family:var(--display);font-weight:700;color:var(--ink-faint)}
.chip[aria-pressed="true"]{color:#2A2140}
.chip[aria-pressed="true"] .s{color:#2A2140;opacity:.6}
.chip.n[aria-pressed="true"]{background:#8BEFC2}
.chip.j[aria-pressed="true"]{background:#9DD8FF}
.chip.a[aria-pressed="true"]{background:#E3DCF7}
.private{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:700;
  background:#EFE9FF;color:#4B3A8C;border:2px solid var(--line);border-radius:999px;padding:2px 11px}
:root[data-theme="dark"] .private{background:#3A2F63;color:#E3DCF7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .private{background:#3A2F63;color:#E3DCF7}}
.conflict{display:inline-block;font-size:.74rem;font-weight:700;background:var(--yellow);color:#2A2140;
  border:2px solid var(--line);border-radius:8px;padding:1px 8px;margin-top:6px}
.whybox{display:grid;gap:12px;margin-top:16px}
.why{background:var(--surface-2);border:2.5px dashed var(--line);border-radius:15px;padding:12px 14px}
.whyhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.qbtn{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 11px;
  font-size:.82rem;font-weight:500;transition:.12s}
.qbtn:hover{background:#E3DCF7;transform:translateY(-1px)}
.why textarea{margin-top:10px}

.tag{font-family:var(--display);font-weight:700;font-size:.85rem;padding:3px 13px;border-radius:999px;
  border:2.5px solid var(--line);box-shadow:var(--sticker-sm);color:#2A2140}
.tag.n{background:#8BEFC2}.tag.j{background:#9DD8FF}
.parkhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}

textarea,input[type=text],input[type=password],input[type=url]{width:100%;font:inherit;background:var(--surface-2);
  color:var(--ink);border:2.5px solid var(--line);border-radius:13px;padding:10px 13px;margin-top:12px;resize:vertical}

/* ---- 按鈕 ---- */
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;align-items:center}
.btn{border:2.5px solid var(--line);border-radius:14px;padding:10px 22px;font-weight:700;
  font-family:var(--display);font-size:1.02rem;background:var(--mint);color:#fff;
  box-shadow:var(--sticker);transition:.12s}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--line)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:var(--sticker)}
.btn.go{background:var(--red)}
.btn.sun{background:var(--yellow);color:#2A2140}
.btn.sky{background:var(--blue)}
.btn.ghost{background:var(--surface);color:var(--ink)}
.btn.sm{padding:7px 15px;font-size:.9rem;border-radius:11px;box-shadow:var(--sticker-sm)}

/* ---- 送出成功 ---- */
.done{text-align:center;padding:14px 6px}
.done .big{font-size:3.4rem;line-height:1;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
.done h2{font-size:1.7rem;font-weight:800;margin-top:10px}
.summary{display:grid;gap:9px;margin-top:16px;text-align:left}
.srow{display:grid;grid-template-columns:92px 1fr;gap:10px;font-size:.93rem;align-items:start}
.srow dt{color:var(--ink-faint);font-weight:700;font-size:.82rem;padding-top:2px}
.srow dd{margin:0}

/* ---- 老師區 ---- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:11px;margin-top:14px}
.stat{background:var(--surface-2);border:2.5px solid var(--line);border-radius:15px;padding:12px 14px;
  box-shadow:var(--sticker-sm)}
.stat b{display:block;font-family:var(--display);font-size:1.8rem;font-weight:800;
  font-variant-numeric:tabular-nums;line-height:1.15}
.stat b.txt{font-size:1.15rem;line-height:1.35;padding-block:4px}
.stat span{font-size:.78rem;color:var(--ink-faint);font-weight:700}
.groupgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(295px,1fr));gap:13px;margin-top:14px}
.group{border:3px solid var(--line);border-radius:18px;padding:15px;background:var(--surface);
  box-shadow:var(--sticker-sm);min-width:0;position:relative;overflow:hidden}
.group::before{content:"";position:absolute;inset:0 0 auto 0;height:8px}
.group.n::before{background:var(--nine)}.group.j::before{background:var(--jan)}
.group h4{font-family:var(--display);font-size:1.1rem;font-weight:800;margin:6px 0 2px;
  display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.group h4 em{font-style:normal;font-size:.76rem;color:var(--ink-faint);font-weight:600;font-family:var(--body)}
.members{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0}
.members span{background:var(--surface-2);border:2px solid var(--line);border-radius:9px;
  padding:2px 9px;font-size:.87rem;font-weight:500}
.mchip{background:var(--surface-2);border:2px solid var(--line);border-radius:9px;
  padding:2px 9px;font-size:.87rem;font-weight:500;transition:.12s}
.mchip:hover{background:var(--yellow);transform:translateY(-1px)}
.mchip.lead{background:var(--yellow);font-weight:700}
.mchip.picked{background:var(--grape);color:#fff;border-color:var(--grape)}
.leadsel{display:flex;align-items:center;gap:7px;font-size:.8rem;font-weight:700;color:var(--ink-faint);
  margin-top:4px}
.leadsel select{flex:1;min-width:0;font:inherit;font-size:.85rem;font-weight:500;color:var(--ink);
  background:var(--surface-2);border:2px solid var(--line);border-radius:9px;padding:4px 8px}
.lock{max-width:460px;margin:30px auto 0;text-align:center}
.lock .lockemo{font-size:3.2rem;line-height:1}
.lock h2.q{margin-top:8px}
.lock input{text-align:center;letter-spacing:.14em;max-width:280px;margin-inline:auto}
.lock .hint{text-align:center}
.movebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;
  background:#EFE9FF;border:2.5px solid var(--line);border-radius:13px;padding:9px 14px;font-size:.9rem}
:root[data-theme="dark"] .movebar{background:#3A2F63}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .movebar{background:#3A2F63}}
.meta{font-size:.81rem;color:var(--ink-soft);display:grid;gap:3px;border-top:2px dotted var(--ink-faint);padding-top:9px}
.meta b{color:var(--ink)}
.plan{font-size:.81rem;color:var(--ink-soft);margin-top:8px;border-top:2px dotted var(--ink-faint);padding-top:9px}
.plan ul{margin:5px 0 0;padding-left:19px}
.plan li{margin-bottom:2px}
.planblk{margin-top:7px}
.planblk i{display:block;font-style:normal;font-weight:800;font-size:.78rem;letter-spacing:.02em}
.planblk span{display:block;color:var(--ink-soft);font-size:.8rem;line-height:1.55}
/* ---- 關係一覽 ---- */
.relgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px;margin-top:14px}
.relpark{background:var(--surface-2);border:2.5px solid var(--line);border-radius:16px;padding:14px;min-width:0}
.relsec{margin-top:14px}
.relsec:first-of-type{margin-top:10px}
.relsec h4{font-family:var(--display);font-size:.98rem;font-weight:800;display:flex;align-items:center;
  gap:6px;flex-wrap:wrap}
.relsec h4 em{font-style:normal;font-size:.78rem;color:var(--ink-faint);font-weight:700;font-family:var(--body)}
.relnote{font-size:.78rem;color:var(--ink-faint);margin-top:7px;line-height:1.5}
.relempty{font-size:.85rem;color:var(--ink-faint);margin-top:8px}
.pairs{display:flex;flex-direction:column;gap:6px;margin-top:9px}
.pair{display:flex;align-items:center;gap:7px;flex-wrap:wrap;background:var(--surface);
  border:2px solid var(--line);border-radius:11px;padding:6px 10px;font-size:.88rem}
.pair.ok{border-left:7px solid var(--mint)}
.pair.one{border-left:7px solid var(--ink-faint)}
.pair.avoid{border-left:7px solid var(--red);flex-direction:column;align-items:stretch;gap:4px}
.pairtop{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.pchip{font-weight:700;background:var(--surface-2);border:1.5px solid var(--line);
  border-radius:7px;padding:1px 8px;font-size:.86rem}
.arrow{font-weight:800;color:var(--ink-faint)}
.dir{font-size:.74rem;font-weight:700;color:var(--ink-faint);margin-left:auto}
.why{font-size:.8rem;color:var(--ink-soft);line-height:1.5}
.relsec details summary{cursor:pointer;font-size:.86rem;font-weight:700;color:var(--blue);margin-top:8px}
.tablewrap{overflow-x:auto;margin-top:13px;border:2.5px solid var(--line);border-radius:15px}
table{border-collapse:collapse;width:100%;font-size:.87rem;min-width:640px}
th,td{text-align:left;padding:8px 11px;border-bottom:2px solid var(--surface-2);vertical-align:top}
th{background:var(--yellow);color:#2A2140;font-size:.78rem;letter-spacing:.03em;font-weight:800}
tr:last-child td{border-bottom:none}
.miss{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.miss span{background:var(--surface);border:2px dashed var(--ink-faint);border-radius:9px;padding:2px 9px;font-size:.85rem}
.note{background:var(--surface-2);border:2.5px solid var(--line);border-left-width:9px;border-radius:13px;
  padding:11px 14px;font-size:.89rem;color:var(--ink-soft);margin-top:13px}
.note.ok{border-left-color:var(--mint)}
.note.warn{border-left-color:var(--yellow)}
.note.bad{border-left-color:var(--red)}
.note b{color:var(--ink)}
.seg{display:inline-flex;background:var(--surface-2);border:2.5px solid var(--line);border-radius:14px;
  padding:3px;gap:3px;flex-wrap:wrap;box-shadow:var(--sticker-sm)}

const COURAGE_FACES=[

/* ============ 配對演算法 ============ */
const APART=(a,b)=>(a.avoid||[]).includes(b.seat)||(b.avoid||[]).includes(a.seat);
/* 評分採「層級制」，上一層永遠壓過下一層：
   ① 不想同組：-10億，任何分組都不能有
   ② 互相點名的兩人同組：每對 +100萬
   ③ 每個人組裡至少有一位自己點名的人：每人 +1萬（在 groupScore 裡算）
   ④ 單方面點名的兩人同組：每對 +300
   ⑤ 設施類型重疊最高 +6、膽量接近最高 +2 */
const PS_CACHE=new WeakMap();
function pairScore(a,b,park){
  let m=PS_CACHE.get(a); if(!m){m=new Map();PS_CACHE.set(a,m);}
  const key=park+b.seat;
  if(m.has(key)) return m.get(key);
  let s;
  if(APART(a,b)) s=-1e13;
  else{
    const aw=(a.mates[park]||[]).includes(b.seat), bw=(b.mates[park]||[]).includes(a.seat);
    const W=(aw&&bw)?1e6:((aw||bw)?1000:0);
    const A=new Set(a.cats), B=new Set(b.cats);
    let inter=0; A.forEach(x=>{if(B.has(x))inter++});
    const uni=new Set([...a.cats,...b.cats]).size||1;
    const C=6*(inter/uni)+2*(1-Math.abs(a.courage-b.courage)/4);
    s=W+C;
  }
  m.set(key,s); return s;
}
const GMIN=2, GMAX=4;                          // 每組人數下限／上限
const ALLOW_SIZES=new Set([2,3,4]);            // 老師規定：每組 2、3、4 人
const isGirl=m=>m.seat>=21;                    // 21～33 號是女生
const loneGirl=g=>g.filter(isGirl).length===1; // 有女生的組至少要 2 位女生
/* 先決定要分幾組、每組幾人，讓所有組都落在 2～4 人 */
function targetSizes(n,pref){
  if(n<=0) return [];
  if(n<=GMAX) return [n];
  const kMin=Math.ceil(n/GMAX), kMax=Math.floor(n/GMIN);
  const k=Math.max(kMin,Math.min(kMax,Math.round(n/pref)));
  const base=Math.floor(n/k), rem=n%k, sizes=[];
  for(let i=0;i<k;i++) sizes.push(base+(i<rem?1:0));
  return sizes.sort((a,b)=>b-a);               // 人多的組先排
}
/* 組長：組內被點名最多的人優先，其次全班被點名數、膽量 */
function leaderRank(m,g,park,all){
  const inG=g.filter(x=>x.seat!==m.seat&&(x.mates[park]||[]).includes(m.seat)).length;
  const inClass=all.filter(x=>x.seat!==m.seat&&(x.mates[park]||[]).includes(m.seat)).length;
  return inG*100 + inClass*5 + m.courage*0.5 - m.seat*0.001;
}
const withLeader=(g,park,all)=>g.slice().sort((a,b)=>leaderRank(b,g,park,all)-leaderRank(a,g,park,all));

/* 彈性分組：從最合得來的兩人開始長；要長大必須「有人想一起玩」，光靠設施類型不會長 */
const FLEX_FLOOR=50;
function buildFlexible(list,park){
  const pool=list.slice(), groups=[];
  while(pool.length>=GMIN){
    let bi=0,bj=1,bs=-Infinity;
    for(let i=0;i<pool.length;i++)for(let j=i+1;j<pool.length;j++){
      const sc=pairScore(pool[i],pool[j],park);
      if(sc>bs){bs=sc;bi=i;bj=j;}
    }
    const g=[pool[bi],pool[bj]];
    pool.splice(Math.max(bi,bj),1); pool.splice(Math.min(bi,bj),1);
    while(g.length<GMAX&&pool.length){
      let k=-1,ks=-Infinity;
      pool.forEach((p,idx)=>{
        const avg=g.reduce((t,m)=>t+pairScore(p,m,park),0)/g.length;
        if(avg>ks){ks=avg;k=idx;}
      });
      if(ks<FLEX_FLOOR && pool.length!==1) break;
      if(ks<FLEX_FLOOR && pool.length===1 && g.length>=GMAX) break;
      g.push(pool.splice(k,1)[0]);
    }
    groups.push(g);
  }
  pool.forEach(p=>{
    let best=-1,bs=-Infinity;
    groups.forEach((g,i)=>{ if(g.length>=GMAX) return;
      const avg=g.reduce((t,m)=>t+pairScore(p,m,park),0)/g.length;
      if(avg>bs){bs=avg;best=i;}});
    if(best<0) groups.push([p]); else groups[best].push(p);
  });
  return groups;
}
/* 固定人數：依 targetSizes 決定每組幾人 */
function buildFixed(list,park,pref){
  const pool=list.slice(), groups=[];
  targetSizes(pool.length,pref).forEach(sz=>{
    if(!pool.length) return;
    if(pool.length<=sz){groups.push(pool.splice(0));return;}
    let bi=0,bj=1,bs=-Infinity;
    for(let i=0;i<pool.length;i++)for(let j=i+1;j<pool.length;j++){
      const sc=pairScore(pool[i],pool[j],park);
      if(sc>bs){bs=sc;bi=i;bj=j;}
    }
    const g=[pool[bi],pool[bj]];
    pool.splice(Math.max(bi,bj),1); pool.splice(Math.min(bi,bj),1);
    while(g.length<sz&&pool.length>0){
      let k=0,ks=-Infinity;
      pool.forEach((p,idx)=>{
        const avg=g.reduce((t,m)=>t+pairScore(p,m,park),0)/g.length;
        if(avg>ks){ks=avg;k=idx;}
      });
      g.push(pool.splice(k,1)[0]);
    }
    groups.push(g);
  });
  pool.forEach(p=>{
    let best=-1,bs=-Infinity;
    groups.forEach((g,i)=>{ if(g.length>=GMAX) return;
      const avg=g.reduce((t,m)=>t+pairScore(p,m,park),0)/g.length;
      if(avg>bs){bs=avg;best=i;}});
    if(best<0) groups.push([p]); else groups[best].push(p);
  });
  return groups;
}
function hasClash(g){
  for(let i=0;i<g.length;i++)for(let j=i+1;j<g.length;j++) if(APART(g[i],g[j])) return true;
  return false;
}
const clashCount=gs=>gs.reduce((t,g)=>{let c=0;
  for(let i=0;i<g.length;i++)for(let j=i+1;j<g.length;j++) if(APART(g[i],g[j]))c++;return t+c;},0);
/* 一組的分數（層級制，上一層永遠壓過下一層）：
   ① 不想同組：-10兆（pairScore 裡），任何分組都不會有
   ② 比較孤單的同學身邊有自己點名的人：每人 +100億
   ③ 每個人組裡至少有一位自己點名的人（單方面點名也算）：每人 +1億
   ④ 互相點名的兩人同組：每對 +100萬
   ⑤ 女生不落單（不能是一群男生裡唯一的女生）：違反一組 -10萬
   ⑥ 單方面點名同組 +1000、設施類型與膽量最多 +8 */
const HAS_FRIEND=1e8, LONELY_FRIEND=1e10, LONE_GIRL=1e5;
/* 比較孤單的同學：被點名不超過 1 次，而且沒有任何互選 */
const LONELY={nine:new Set(),jan:new Set()};
function lonelySet(list,park){
  const byS=Object.fromEntries(list.map(e=>[e.seat,e]));
  return new Set(list.filter(e=>{
    const inc=list.filter(o=>o.seat!==e.seat&&(o.mates[park]||[]).includes(e.seat)).length;
    const mut=(e.mates[park]||[]).some(s=>byS[s]&&(byS[s].mates[park]||[]).includes(e.seat));
    return inc<=1&&!mut;
  }).map(e=>e.seat));
}
const hasFriendIn=(m,g,park)=>g.some(o=>o.seat!==m.seat&&(m.mates[park]||[]).includes(o.seat));
/* 組別結構規則（硬性）：2 人組必須互選；3 人組每個人都要跟組內至少一人有點名關係（不能落單） */
const tie=(a,b,park)=>(a.mates[park]||[]).includes(b.seat)||(b.mates[park]||[]).includes(a.seat);
function shapeBad(g,park){
  if(g.length===2) return !((g[0].mates[park]||[]).includes(g[1].seat)&&(g[1].mates[park]||[]).includes(g[0].seat));
  if(g.length===3) return g.some(m=>!g.some(o=>o!==m&&tie(m,o,park)));
  return false;
}
const SHAPE_BAD=1e12;
const groupScore=(g,park)=>{let s=(loneGirl(g)?-LONE_GIRL:0)-(shapeBad(g,park)?SHAPE_BAD:0);
  for(let i=0;i<g.length;i++){
    for(let j=i+1;j<g.length;j++) s+=pairScore(g[i],g[j],park);
    if(hasFriendIn(g[i],g,park)) s+=HAS_FRIEND+(LONELY[park].has(g[i].seat)?LONELY_FRIEND:0);
  }
  return s;};
const lonelyOk=(gs,park)=>gs.reduce((t,g)=>t+g.filter(m=>LONELY[park].has(m.seat)&&hasFriendIn(m,g,park)).length,0);
const friendCount=(gs,park)=>gs.reduce((t,g)=>t+g.filter((m,i)=>
  g.some((o,k)=>k!==i&&(m.mates[park]||[]).includes(o.seat))).length,0);
const mutualCount=(gs,park)=>gs.reduce((t,g)=>{let c=0;
  for(let i=0;i<g.length;i++)for(let j=i+1;j<g.length;j++)
    if((g[i].mates[park]||[]).includes(g[j].seat)&&(g[j].mates[park]||[]).includes(g[i].seat))c++;
  return t+c;},0);
/* 局部搜尋：反覆「移一個人」或「兩人互換」，只要總分變高就採用。
   因為衝突是 -1000000，任何會讓不想同組的人碰在一起的變動都不可能被採用。 */
function localSearch(gs,park,allowMove){
  gs=gs.map(g=>g.slice());
  for(let pass=0;pass<60;pass++){
    let best=null;
    const sc=gs.map(g=>groupScore(g,park));
    for(let i=0;i<gs.length;i++)for(let j=0;j<gs.length;j++){
      if(i===j) continue;
      // 移動：i 組的人搬去 j 組
      if(allowMove && ALLOW_SIZES.has(gs[i].length-1) && ALLOW_SIZES.has(gs[j].length+1)){
        for(let x=0;x<gs[i].length;x++){
          const gi=gs[i].filter((_,k)=>k!==x), gj=gs[j].concat(gs[i][x]);
          const gain=groupScore(gi,park)+groupScore(gj,park)-sc[i]-sc[j];
          if(gain>1e-6&&(!best||gain>best.gain)) best={i,j,gi,gj,gain};
        }
      }
      // 互換（只算一次 i<j）
      if(i<j){
        for(let x=0;x<gs[i].length;x++)for(let y=0;y<gs[j].length;y++){
          const gi=gs[i].map((m,k)=>k===x?gs[j][y]:m);
          const gj=gs[j].map((m,k)=>k===y?gs[i][x]:m);
          const gain=groupScore(gi,park)+groupScore(gj,park)-sc[i]-sc[j];
          if(gain>1e-6&&(!best||gain>best.gain)) best={i,j,gi,gj,gain};
        }
      }
    }
    if(!best) break;
    gs[best.i]=best.gi; gs[best.j]=best.gj;
  }
  return gs.filter(g=>g.length);
}
/* 固定亂數，讓同一份資料每次算出來都一樣 */
function seededRandom(seed){
  return ()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);
    t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
}
const RESTARTS=200;
/* n 人拆成 2、3、4 人組的所有方式 */
function sizePlans(n){
  const out=[];
  for(let a=0;a*4<=n;a++)for(let b=0;a*4+b*3<=n;b++){
    const r=n-a*4-b*3; if(r%2===0) out.push([...Array(a).fill(4),...Array(b).fill(3),...Array(r/2).fill(2)]);
  }
  return out.length?out:[[n]];
}
const signature=gs=>gs.map(g=>g.map(m=>m.seat).sort((x,y)=>x-y).join('.')).sort().join('|');
/* 候選組合庫：每按一次重新分組就再找一批，越按越多，好的組合都留著 */
const POOL={nine:{fp:'',map:new Map(),seen:new Set()},jan:{fp:'',map:new Map(),seen:new Set()}};
const fingerprint=list=>list.map(e=>e.seat+':'+(e.mates.nine||[]).join(',')+';'+(e.mates.jan||[]).join(',')
  +';'+(e.avoid||[]).join(',')+';'+e.cats.join(',')+';'+e.courage).join('|');
function searchPool(list,park,seed,restarts){
  const P=POOL[park], fp=fingerprint(list);
  if(P.fp!==fp){P.fp=fp;P.map=new Map();P.seen=new Set();LONELY[park]=lonelySet(list,park);}
  const rnd=seededRandom(seed);
  const plans=sizePlans(list.length);
  for(let r=0;r<restarts;r++){
    const sizes=plans[Math.floor(rnd()*plans.length)];
    const sh=list.slice();
    for(let i=sh.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[sh[i],sh[j]]=[sh[j],sh[i]];}
    const start=[];let k=0;sizes.forEach(n=>{start.push(sh.slice(k,k+n));k+=n;});
    const gs=localSearch(start,park,true);
    const sig=signature(gs);
    if(P.map.has(sig)) continue;
    P.map.set(sig,{seats:gs.map(g=>g.map(m=>m.seat)),sig,cl:clashCount(gs),sb:gs.filter(g=>shapeBad(g,park)).length,lg:gs.filter(loneGirl).length,
      lo:lonelyOk(gs,park),fr:friendCount(gs,park),mu:mutualCount(gs,park),tot:gs.reduce((t,g)=>t+groupScore(g,park),0)});
  }
  return P;
}
/* 把所有合規的組合依品質排好：先比「有好友的人數」，再比「互選對數」，最後比總分 */
function rankedValid(P){
  let all=[...P.map.values()];
  const ok=all.filter(x=>x.cl===0&&x.sb===0); if(ok.length) all=ok;
  return all.sort((x,y)=>x.cl-y.cl||x.sb-y.sb||y.lo-x.lo||y.fr-x.fr||y.mu-x.mu||x.lg-y.lg||y.tot-x.tot);
}
/* variety=false：第一次分組，固定給最好的那一份
   variety=true ：重新分組，從最好的等級裡挑還沒出現過的；那一級都用過了才往下一級 */
function buildGroups(list,park,pref,seed,variety){
  if(list.length<=GMAX) return [withLeader(list,park,list)];
  const byS=Object.fromEntries(list.map(e=>[e.seat,e]));
  const base=list.reduce((t,e)=>t*31+e.seat,7)+(park==='nine'?1:2);
  let P=searchPool(list,park,variety?seed:base,variety?RESTARTS:400);
  let ranked=rankedValid(P);
  let pick=ranked[0];
  if(variety){
    let fresh=ranked.filter(x=>!P.seen.has(x.sig));
    if(!fresh.length){ P.seen=new Set(); fresh=ranked; }
    const best=ranked[0], tier=fresh[0];
    const same=fresh.filter(x=>x.lo===tier.lo&&x.fr===tier.fr&&x.mu===tier.mu&&x.lg===tier.lg);
    pick=same[Math.floor(seededRandom(seed+7)()*same.length)];
    if(pick.lo<best.lo||pick.fr<best.fr||pick.mu<best.mu||pick.lg>best.lg)
      setTimeout(()=>toast(`最好的組合都用過了，這份稍差一點：有好友 ${pick.fr} 人、互選 ${pick.mu} 對`),0);
  }
  P.seen.add(pick.sig);
  return pick.seats.map(g=>withLeader(g.map(s=>byS[s]),park,list));
}
/* 以座號保存分組，讓老師的手動調整可以留著。每組第一位就是組長。 */
function ensureGroups(park,entries){
  const byS=Object.fromEntries(entries.map(e=>[e.seat,e]));
  LONELY[park]=lonelySet(entries,park);
  const valid=new Set(entries.map(e=>e.seat));
  let gs=state.groups[park];
  if(!gs){
    const rg=state.regen&&state.regen[park];
    gs=buildGroups(entries,park,state.size,rg?rg.seed:null,!!rg).map(g=>g.map(m=>m.seat));
    if(state.regen) state.regen[park]=null;
  }else{
    gs=gs.map(g=>g.filter(s=>valid.has(s)));
    const placed=new Set(gs.flat());
    entries.filter(e=>!placed.has(e.seat)).forEach(e=>{   // 新交的人補進最合適的組
      let best=-1,bs=-Infinity;
      gs.forEach((g,i)=>{ if(g.length>=GMAX||g.some(s=>byS[s]&&APART(e,byS[s]))) return;
        const avg=g.length?g.reduce((t,s)=>t+pairScore(e,byS[s],park),0)/g.length:0;
        if(avg>bs){bs=avg;best=i;}});
      if(best<0) gs.push([e.seat]); else gs[best].push(e.seat);
    });
  }
  state.groups[park]=gs; saveGroups();
  return gs;
}
const groupMembers=(gs,byS)=>gs.map(g=>g.map(s=>byS[s]).filter(Boolean));
function groupInfo(g,park){
  const count={}; g.forEach(m=>m.cats.forEach(c=>count[c]=(count[c]||0)+1));
  const top=Object.entries(count).sort((a,b)=>b[1]-a[1]);
  const shared=top.filter(([,n])=>n===g.length).map(([c])=>c);
  const main=top.slice(0,3).map(([c])=>c);
  const avg=g.reduce((t,m)=>t+m.courage,0)/g.length;
  let wish=0,wishTotal=0;
  g.forEach(m=>{(m.mates[park]||[]).forEach(w=>{wishTotal++;if(g.some(x=>x.seat===w))wish++;});});
  let clash=0;
  for(let i=0;i<g.length;i++)for(let j=i+1;j<g.length;j++) if(APART(g[i],g[j])) clash++;
  // 全組至少一半人想玩的類型，就把那個類型在這個園區的設施全部列進建議
  const half=Math.max(1,Math.ceil(g.length/2));
  let liked=top.filter(([,n])=>n>=half).map(([c])=>c);
  if(!liked.length) liked=top.slice(0,2).map(([c])=>c);
  const plan=liked.map(c=>({cat:c,
    rides:(PARKS[park].rides[c]||[]).map(r=>r.split('（')[0])}));
  const rides=[];
  plan.forEach(b=>b.rides.slice(0,2).forEach(r=>rides.push({cat:b.cat,r})));
  return {shared,main,liked,plan,avg,wish,wishTotal,clash,rides};
}
/* 全班互選關係：雙向、單向、希望避免同組 */
function relations(entries){
  const byS=Object.fromEntries(entries.map(e=>[e.seat,e]));
  const res={};
  PARK_LIST.forEach(p=>{
    const mutual=[], oneway=[];
    entries.forEach(a=>(a.mates[p.key]||[]).forEach(s=>{
      const b=byS[s]; if(!b) return;
      if((b.mates[p.key]||[]).includes(a.seat)){ if(a.seat<b.seat) mutual.push([a,b]); }
      else oneway.push([a,b]);
    }));
    const sk=(x,y)=>x[0].seat-y[0].seat||x[1].seat-y[1].seat;
    res[p.key]={mutual:mutual.sort(sk), oneway:oneway.sort(sk)};
  });
  const avoid=[], seen=new Set();
  entries.forEach(a=>(a.avoid||[]).forEach(s=>{
    const b=byS[s]; if(!b) return;
    const k=Math.min(a.seat,b.seat)+'-'+Math.max(a.seat,b.seat);
    if(seen.has(k)) return; seen.add(k);
    const both=(b.avoid||[]).includes(a.seat);
    avoid.push({a,b,both,
      whyA:(a.why&&a.why[b.seat])||'', whyB:both?((b.why&&b.why[a.seat])||''):''});
  }));
  res.avoid=avoid.sort((x,y)=>x.a.seat-y.a.seat);
  // 人氣：被幾個人點名（兩園合計，不重複算同一人）
  res.pop=entries.map(e=>({e,
    n:entries.filter(o=>o.seat!==e.seat&&
      ((o.mates.nine||[]).includes(e.seat)||(o.mates.jan||[]).includes(e.seat))).length}))
    .sort((x,y)=>y.n-x.n||x.e.seat-y.e.seat);
  return res;
}
/* 全班「想先分開玩」有多少真的被分開了 */
function apartStats(entries,groups){
  let total=0,kept=0;
  entries.forEach(a=>(a.avoid||[]).forEach(s=>{
    const b=entries.find(x=>x.seat===s); if(!b) return;
    total++;
    const ga=groups.find(g=>g.some(m=>m.seat===a.seat));
    if(ga && !ga.some(m=>m.seat===s)) kept++;
  }));
  return {total,kept};
}

/* ============ 送出 / 讀取 ============ */
function normalise(r){
  const seat=Number(r.seat);
  if(!NAME_OF[seat]) return null;
  const clean=a=>[...new Set((a||[]).map(Number).filter(n=>NAME_OF[n]&&n!==seat))];
  // 想避免同組：座號陣列 + 對應原因陣列（或 why 物件）
  const rawA=(r.avoid||[]).map(Number), rawW=r.avoidWhy||[];
  const why={}, avoid=[];
  rawA.forEach((n,i)=>{
    if(!NAME_OF[n]||n===seat||avoid.includes(n)) return;
    avoid.push(n);
    const txt=(r.why&&r.why[n]!==undefined)?r.why[n]:rawW[i];
    why[n]=String(txt||'').replace(/[|]/g,'／').trim().slice(0,60);
  });
  return {seat, name:NAME_OF[seat], courage:Math.min(5,Math.max(1,Number(r.courage)||3)),
    cats:[...new Set((r.cats||[]).filter(c=>CAT_OF[c]))],
    mates:{nine:clean(r.nine), jan:clean(r.jan)}, avoid:avoid, why:why, note:String(r.note||'')};
}

}

function parseCSV(text){
  const rows=[];let row=[],cell='',q=false;
  text=text.replace(/^﻿/,'');
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=ch; }
    else if(ch==='"') q=true;
    else if(ch===','){row.push(cell);cell='';}
    else if(ch==='\n'){row.push(cell);rows.push(row);row=[];cell='';}
    else if(ch!=='\r') cell+=ch;
  }
  if(cell||row.length){row.push(cell);rows.push(row);}
  return rows.filter(r=>r.some(c=>c.trim()!==''));
}

        const ex=`<b>九族</b> ${esc(PARKS.nine.rides[c.id][0].split('（')[0])}　<b>劍湖山</b> ${esc(PARKS.jan.rides[c.id][0].split('（')[0])}`;
        return `<button class="cat" style="--ccol:${c.col}" data-act="cat" data-id="${c.id}" aria-pressed="${d.cats.includes(c.id)}">
          <span class="tick">✓</span>
          <span class="ctop"><span class="emo">${c.emoji}</span>
            <span><span class="cname">${c.name}</span><br><span class="csub">${c.sub}</span></span></span>
          <span class="cdesc">${c.desc}</span><span class="ex">${ex}</span></button>`;}).join('')}</div>
      ${ridesAccordion()}
      ${navRow(d.cats.length>0)}
    </div>`;
  } else if(state.step===3||state.step===4){
    const p=state.step===3?PARKS.nine:PARKS.jan;
    const sel=d.mates[p.key];
    body=`<div class="card">
      ${stepLabel(state.step+1)}
      <h2 class="q">${p.key==='nine'?'🌿':'🎡'} 在${p.name}想跟誰一起玩？</h2>
      <div class="parkhead"><span class="tag ${p.cls}">${p.name}</span></div>
      <p class="hint">可以複選，也可以一個都不選（那就依你喜歡的設施類型安排）。想到誰就點誰，老師會盡量安排，但組別人數有限，不一定每個都排得進來。</p>
      <div class="chips">${STUDENTS.filter(([s])=>s!==d.seat).map(([s,n])=>
        `<button class="chip ${p.cls}" data-act="mate" data-park="${p.key}" data-seat="${s}" aria-pressed="${sel.includes(s)}">
          <span class="s">${s}</span>${n}</button>`).join('')}</div>
      <p class="hint" style="margin-top:14px">已選 <b>${sel.length}</b> 人${sel.length?'：'+sel.map(s=>esc(NAME_OF[s])).join('、'):''}</p>
      ${navRow()}
    </div>`;
  } else if(state.step===5){
    const sel=d.avoid;
    const ready=sel.every(s=>(d.why[s]||'').trim().length>=2);
    body=`<div class="card">
      ${stepLabel(6)}
      <h2 class="q">🙅 這次想避免跟誰同一組？</h2>
      <div class="parkhead"><span class="private">🔒 只有老師看得到，不會公布，也不會告訴對方</span></div>
      <p class="hint"><b>沒有的話就空著</b>，直接按下一步。有的話請點出同學，<b>並寫下原因</b>——老師要知道原因才能判斷怎麼安排。</p>
      <div class="chips">${STUDENTS.filter(([s])=>s!==d.seat).map(([s,n])=>
        `<button class="chip a" data-act="avoid" data-seat="${s}" aria-pressed="${sel.includes(s)}">
          <span class="s">${s}</span>${n}</button>`).join('')}</div>
      ${sel.length?`<div class="whybox">${sel.map(s=>`
        <div class="why">
          <div class="whyhead"><span class="tag" style="background:#E3DCF7">${s} ${esc(NAME_OF[s])}</span>
            <span class="hint" style="margin:0">為什麼想避免同組？</span></div>
          <div class="quick">${WHY_SUGGESTIONS.map(w=>
            `<button class="qbtn" data-act="whyfill" data-seat="${s}" data-text="${esc(w)}">${esc(w)}</button>`).join('')}</div>
          <textarea class="whyin" data-seat="${s}" rows="2" maxlength="60"
            placeholder="點上面的句子，或自己寫（最多 60 字）">${esc(d.why[s]||'')}</textarea>
        </div>`).join('')}</div>
        ${ready?'':'<div class="note bad">每一位都要寫原因才能繼續（至少 2 個字）。</div>'}`
      :`<p class="hint" style="margin-top:14px">目前沒有選任何人 👍</p>`}
      ${navRow(ready)}
    </div>`;
  } else {
    body=`<div class="card">
      ${stepLabel(7)}<h2 class="q">💬 還有什麼想跟老師說？</h2>
      <p class="hint">非必填。例如「我會暈車」「一定要玩到 G5」「午餐想跟小隊一起吃」。最多 80 字。</p>
      <textarea id="noteBox" rows="3" maxlength="80" placeholder="想說什麼都可以⋯⋯">${esc(d.note||'')}</textarea>
      <div class="card flat" style="margin-top:18px;margin-bottom:0">
        <h3 style="font-size:1.05rem;font-weight:800">✅ 最後確認一下</h3>
        <dl class="summary">
          <div class="srow"><dt>姓名</dt><dd>${d.seat?`${d.seat} 號　${esc(NAME_OF[d.seat])}`:'—'}</dd></div>
          <div class="srow"><dt>膽量</dt><dd>${COURAGE_FACES[d.courage-1].face} ${COURAGE_FACES[d.courage-1].lab}</dd></div>
          <div class="srow"><dt>喜歡類型</dt><dd>${d.cats.map(catChip).join('　')||'<span style="color:var(--ink-faint)">未選</span>'}</dd></div>
          <div class="srow"><dt>九族玩伴</dt><dd>${d.mates.nine.map(s=>esc(NAME_OF[s])).join('、')||'<span style="color:var(--ink-faint)">沒有特別指定</span>'}</dd></div>
          <div class="srow"><dt>劍湖山玩伴</dt><dd>${d.mates.jan.map(s=>esc(NAME_OF[s])).join('、')||'<span style="color:var(--ink-faint)">沒有特別指定</span>'}</dd></div>
          <div class="srow"><dt>🔒 避免同組</dt><dd>${d.avoid.map(s=>esc(NAME_OF[s])+'（'+esc((d.why[s]||'').trim())+'）').join('、')||'<span style="color:var(--ink-faint)">沒有選任何人</span>'}</dd></div>
        </dl>
      </div>
      <div class="row">
        <button class="btn ghost" data-act="back">← 上一步</button>
        <button class="btn go" data-act="submit" ${state.sending?'disabled':''}>${state.sending?'送出中⋯':'🎉 送出給老師'}</button>
      </div>
      ${DEMO?`<div class="note warn"><b>示範模式</b>：老師還沒設定收件網址，現在送出只會暫存在這台裝置上。</div>`:''}
    </div>`;
  }
  return rail+body;
}
const stepLabel=n=>`<div class="steplabel"><span class="num">${n}</span>步驟 ${n} / 7</div>`;
const navRow=(ok=true)=>`<div class="row">
  <button class="btn ghost" data-act="back">← 上一步</button>
  <button class="btn go" data-act="next" ${ok?'':'disabled'}>下一步 →</button></div>`;
function ridesAccordion(){
  return `<details class="allrides"><summary>🔍 看看每種類型包含哪些設施（完整清單）</summary>
    ${PARK_LIST.map(p=>`<div style="margin-top:14px"><span class="tag ${p.cls}">${p.name}</span>
      ${CATS.map(c=>`<div class="ridecat"><b style="color:${c.col}">${c.emoji} ${c.name}</b>
        <p>${p.rides[c.id].map(esc).join('、')}</p></div>`).join('')}</div>`).join('')}
    <p class="ref">設施與身高限制整理自兩園官網與遊記，出發前請以官網公告為準：
      <a href="${PARKS.nine.site}" target="_blank" rel="noopener">九族文化村</a>
      <a href="${PARKS.jan.site}" target="_blank" rel="noopener">劍湖山世界</a></p></details>`;
}
function doneCard(){
  const s=state.sent;
  return `<div class="card ticket">
    <div class="done">
      <div class="big">🎊</div>
      <h2>送出完成！</h2>
      <p class="hint">${esc(s.name)}，你的答案已經送給老師了，不用再做任何事。</p>
    </div>
    <dl class="summary" style="margin-top:18px">
      <div class="srow"><dt>膽量</dt><dd>${COURAGE_FACES[s.courage-1].face} ${COURAGE_FACES[s.courage-1].lab}</dd></div>
      <div class="srow"><dt>喜歡類型</dt><dd>${s.cats.map(catChip).join('　')}</dd></div>
      <div class="srow"><dt>九族玩伴</dt><dd>${s.mates.nine.map(x=>esc(NAME_OF[x])).join('、')||'沒有特別指定'}</dd></div>
      <div class="srow"><dt>劍湖山玩伴</dt><dd>${s.mates.jan.map(x=>esc(NAME_OF[x])).join('、')||'沒有特別指定'}</dd></div>
      ${s.avoid.length?`<div class="srow"><dt>🔒 避免同組</dt><dd><span class="private">已私下告訴老師（${s.avoid.length} 人）</span></dd></div>`:''}
      ${s.note?`<div class="srow"><dt>想說的話</dt><dd>${esc(s.note)}</dd></div>`:''}
    </dl>
    <div class="row"><button class="btn ghost sm" data-act="redo">想改答案，重填一次</button></div>
  </div>`;
}

/* ============ 老師頁 ============ */
function teacherView(){
  if(!state.unlocked) return lockScreen();
  const entries=SEATS.map(s=>state.roster[s]).filter(Boolean);
  const done=entries.length, total=STUDENTS.length;
  const missing=STUDENTS.filter(([s])=>!state.roster[s]);
  const catCount={}; entries.forEach(e=>e.cats.forEach(c=>catCount[c]=(catCount[c]||0)+1));
  const hot=Object.entries(catCount).sort((a,b)=>b[1]-a[1])[0];
  const lonely=PARK_LIST.map(p=>({p,list:entries.filter(e=>
      !entries.some(o=>o.seat!==e.seat&&(o.mates[p.key]||[]).includes(e.seat)))}));

  const byS=Object.fromEntries(entries.map(e=>[e.seat,e]));
  const apartAll={total:0,kept:0};
  const groupsHTML = done>=2 ? PARK_LIST.map(p=>{
    const gs=groupMembers(ensureGroups(p.key,entries),byS);
    const ap=apartStats(entries,gs); apartAll.total+=ap.total; apartAll.kept+=ap.kept;
    const mv=state.move&&state.move.park===p.key?state.move:null;
    return `<div class="card">
      <div class="parkhead" style="margin-top:0;justify-content:space-between">
        <span><span class="tag ${p.cls}">${p.name}</span>
          <b style="font-family:var(--display);font-size:1.1rem;margin-left:8px">${gs.length} 組</b>
          <span class="hint" style="margin-left:8px">孤單同學有伴 <b>${lonelyOk(gs,p.key)}/${LONELY[p.key].size}</b>．有好友 <b>${friendCount(gs,p.key)}/${entries.length}</b> 人．互選同組 <b>${mutualCount(gs,p.key)}</b> 對．女生落單 <b>${gs.filter(loneGirl).length}</b> 組</span></span>
        <span style="display:flex;gap:7px;flex-wrap:wrap">
          <button class="btn ghost sm" data-act="regroup" data-park="${p.key}">↺ 重新自動分組</button>
          <button class="btn ghost sm" data-act="addgroup" data-park="${p.key}">➕ 新增一組</button>
          <button class="btn sun sm" data-act="poster" data-park="${p.key}">🖼️ 下載分組圖</button>
        </span>
      </div>
      ${mv?`<div class="movebar">正在移動 <b>${mv.seat} ${esc(byS[mv.seat]?byS[mv.seat].name:'')}</b>
        　→ 點下面任一組的「移到這組」
        <button class="btn ghost sm" data-act="cancelmove">取消</button></div>`
       :`<p class="hint" style="margin-top:10px">點學生名字就能把他移到別組。每按一次「↺ 重新自動分組」都會換一種同樣符合規則的組合。</p>`}
      ${LONELY[p.key].size?`<p class="hint">💛 比較孤單、優先幫他找伴的同學（被點名不超過 1 次且沒有互選）：
        ${[...LONELY[p.key]].sort((a,b)=>a-b).map(s=>`<b>${s} ${esc(NAME_OF[s])}</b>`).join('、')}</p>`:''}
      <div class="groupgrid">${gs.map((g,i)=>{
        const info=groupInfo(g,p.key);
        const bad=!ALLOW_SIZES.has(g.length);
        return `<div class="group ${p.cls}">
          <h4><span>${GROUP_EMOJI[i%GROUP_EMOJI.length]} 第 ${i+1} 組</span>
            <em${bad?' style="color:var(--bad);font-weight:700"':''}>${g.length} 人・膽量 ${info.avg.toFixed(1)}</em></h4>
          <div class="members">${g.map((m,mi)=>
            `<button class="mchip${mv&&mv.seat===m.seat?' picked':''}${mi===0?' lead':''}" data-act="pickmember"
               data-park="${p.key}" data-seat="${m.seat}">${mi===0?'👑 ':''}${m.seat} ${esc(m.name)}</button>`).join('')
            ||'<span style="color:var(--ink-faint)">（空組）</span>'}</div>
          ${g.length>1?`<label class="leadsel">組長
            <select data-act="leader" data-park="${p.key}" data-gi="${i}">
              ${g.map(m=>`<option value="${m.seat}"${m.seat===g[0].seat?' selected':''}>${m.seat} ${esc(m.name)}</option>`).join('')}
            </select></label>`:''}
          ${mv?`<button class="btn sm" style="width:100%" data-act="moveto" data-park="${p.key}" data-gi="${i}">移到這組</button>`
             :(g.length?'':`<button class="btn ghost sm" style="width:100%" data-act="delgroup" data-park="${p.key}" data-gi="${i}">✕ 刪掉這個空組</button>`)}
          ${bad?`<div class="conflict">⚠️ 這組 ${g.length} 人，規定是 2、3 或 4 人</div>`:''}
          ${g.length===2&&shapeBad(g,p.key)?`<div class="conflict">⚠️ 2 人組必須是互相點名的兩個人</div>`:''}
          ${g.length===3&&shapeBad(g,p.key)?`<div class="conflict">⚠️ 3 人組裡有人跟另外兩位都沒有點名關係</div>`:''}
          ${loneGirl(g)?`<div class="conflict">⚠️ 這組只有 1 位女生，請再配一位女生</div>`:''}
          ${g.filter(m=>!(m.mates[p.key]||[]).some(s=>g.some(o=>o.seat===s))).map(m=>
            `<div class="conflict" style="background:var(--surface-2)">💭 ${esc(m.name)} 組裡沒有自己點名的人</div>`).join('')}
          ${info.clash?`<div class="conflict">⚠️ 這組有 ${info.clash} 對希望避免同組</div>`:''}
          <div class="meta">
            <div>共同喜好：<b>${info.main.map(c=>CAT_OF[c].emoji+CAT_OF[c].name).join('、')||'—'}</b></div>
            <div>全組都想玩：<b>${info.shared.map(c=>CAT_OF[c].name).join('、')||'—'}</b></div>
            <div>玩伴心願達成：<b>${info.wishTotal?Math.round(info.wish/info.wishTotal*100):100}%</b>（${info.wish}/${info.wishTotal}）</div>
          </div>
          <div class="plan"><b>${p.key==='nine'?'🌿':'🎢'} ${p.name}　建議遊玩設施</b>
            ${info.plan.map(bk=>`<div class="planblk">
              <i style="color:${CAT_OF[bk.cat].col}">${CAT_OF[bk.cat].emoji} ${CAT_OF[bk.cat].name}</i>
              <span>${bk.rides.map(esc).join('、')}</span></div>`).join('')}</div>
        </div>`;}).join('')}</div></div>`;
  }).join('') : '';
  const apartPct = apartAll.total ? Math.round(apartAll.kept/apartAll.total*100) : null;

  return `<div class="card">
    <div class="parkhead" style="justify-content:space-between;margin-top:0">
      <h2 class="q" style="margin:0">🧑‍🏫 老師專區</h2>
      <span class="private" style="background:var(--surface-2);color:var(--ink-soft)">每組 2～4 人（2 人組必須互選、3 人組不能有人落單）．分組順序：① 不想同組必分開 ② 孤單同學綁定他喜歡的人 ③ 每人身邊有自己點名的人 ④ 互選同組 ⑤ 女生不落單</span>
    </div>
    ${DEMO?`<div class="note warn"><b>示範模式</b>：還沒填 <code>CONFIG.endpoint</code>，學生送出的答案只會留在他們自己的裝置上。
      請依 README 部署 Google Apps Script 後，把網址填進 <code>index.html</code> 最上面的設定區。</div>`:`
    <div class="row" style="margin-top:12px">
      <button class="btn sky sm" data-act="reload" ${state.loading?'disabled':''}>${state.loading?'讀取中⋯':'↻ 讀取最新回覆'}</button>
      <button class="btn ghost sm" data-act="lock">🔒 鎖定離開</button>
    </div>
    ${state.loadErr?`<div class="note bad"><b>讀不到資料：</b>${esc(state.loadErr)}</div>`:''}`}

    <div class="stats">
      <div class="stat"><b>${done} / ${total}</b><span>已回收</span></div>
      <div class="stat"><b>${missing.length}</b><span>還沒交</span></div>
      <div class="stat"><b>${done?Math.round(entries.reduce((t,e)=>t+e.courage,0)/done*10)/10:'—'}</b><span>全班平均膽量</span></div>
      <div class="stat"><b class="txt">${hot?CAT_OF[hot[0]].emoji+' '+CAT_OF[hot[0]].name:'—'}</b><span>最熱門類型</span></div>
      ${apartPct!==null?`<div class="stat"><b>${apartPct}%</b><span>🔒 避免同組達成</span></div>`:''}
    </div>
    ${missing.length?`<div class="note"><b>還沒交的同學：</b><div class="miss">${missing.map(([s,n])=>`<span>${s} ${n}</span>`).join('')}</div></div>`
      :`<div class="note ok">全班 ${total} 人都交了 🎉 可以直接分組。</div>`}

    <div class="row">
      <label class="filebtn btn ghost sm">📂 匯入試算表 CSV
        <input type="file" accept=".csv,text/csv" data-act="importcsv"></label>
      ${done?`<button class="btn ghost sm" data-act="clear">清空目前畫面資料</button>`:''}
    </div>
    <p class="hint">沒網路或臨時要改，也可以把 Google 試算表「下載成 CSV」後從這裡匯入。</p>
  </div>

  ${done?relationsCard(entries):''}

  ${groupsHTML}

  ${done?`<div class="card">
    <div class="parkhead" style="justify-content:space-between;margin-top:0">
      <h3 style="font-size:1.15rem;font-weight:800">📋 全班填答一覽</h3>
      <button class="btn ghost sm" data-act="togglePrivate">${state.showPrivate?'🙈 收起「避免同組」':'👁️ 顯示「避免同組」'}</button>
    </div>
    <div class="tablewrap"><table>
      <thead><tr><th>座號</th><th>姓名</th><th>膽量</th><th>喜歡類型</th><th>九族玩伴</th><th>劍湖山玩伴</th>${state.showPrivate?'<th>🔒 避免同組（含原因）</th>':''}<th>備註</th></tr></thead>
      <tbody>${entries.map(e=>`<tr>
        <td>${e.seat}</td><td>${esc(e.name)}</td>
        <td>${COURAGE_FACES[e.courage-1].face} ${e.courage}</td>
        <td>${e.cats.map(c=>CAT_OF[c].emoji+CAT_OF[c].name).join('、')}</td>
        <td>${e.mates.nine.map(s=>esc(NAME_OF[s])).join('、')||'—'}</td>
        <td>${e.mates.jan.map(s=>esc(NAME_OF[s])).join('、')||'—'}</td>
        ${state.showPrivate?`<td>${e.avoid.map(s=>`<b>${esc(NAME_OF[s])}</b>：${esc(e.why[s]||'（未寫原因）')}`).join('<br>')||'—'}</td>`:''}
        <td>${esc(e.note)||'—'}</td></tr>`).join('')}</tbody>
    </table></div>
    <div class="note"><span class="private">🔒 保密</span>　「避免同組」和原因是學生私下寫給老師的，預設收起來，
      投影或請學生幫忙看畫面時請不要打開，也請不要轉述給任何人。下載的 CSV 會含這一欄。
      若原因提到衝突或霸凌，分組之外也值得另外了解。</div>
    ${lonely.map(({p,list})=>list.length?
      `<div class="note bad"><b>${p.name}：沒有被任何人點名的同學</b>（記得多關照）
        <div class="miss">${list.map(e=>`<span>${e.seat} ${esc(e.name)}</span>`).join('')}</div></div>`:'').join('')}
    <div class="row">
      <button class="btn sky" data-act="csvRaw">⬇️ 下載填答原始資料</button>
      <button class="btn sun" data-act="csvGroups">⬇️ 下載分組結果</button>
    </div>
    <p class="hint">CSV 以 UTF-8 BOM 輸出，Excel 或 Google 試算表開啟都不會亂碼。</p>
  </div>`:''}`;
}

/* ============ 關係一覽 ============ */
function relationsCard(entries){
  const R=relations(entries);
  const chip=m=>`<b class="pchip">${m.seat} ${esc(m.name)}</b>`;
  const noOne=R.pop.filter(x=>x.n===0);
  const parkBlock=p=>{
    const r=R[p.key];
    return `<div class="relpark">
      <div class="parkhead" style="margin-top:0"><span class="tag ${p.cls}">${p.name}</span></div>
      <div class="relsec">
        <h4>💞 互相想一起　<em>${r.mutual.length} 對</em></h4>
        ${r.mutual.length?`<div class="pairs">${r.mutual.map(([a,b])=>
          `<div class="pair ok">${chip(a)}<span class="arrow">↔</span>${chip(b)}</div>`).join('')}</div>`

        <p class="relnote">兩個人都把對方寫進去了，排在同一組兩邊都開心，分組時優先湊在一起。</p>

    <div class="relsec" style="margin-top:18px">

          ${state.showPrivate?'🙈 收起':'👁️ 顯示'}</button></h4>
      ${R.avoid.length?(state.showPrivate?`<div class="pairs">${R.avoid.map(v=>
        `<div class="pair avoid">
           <div class="pairtop">${chip(v.a)}<span class="arrow">⇸</span>${chip(v.b)}
             <span class="dir">${v.both?'雙方都提':'單方提出'}</span></div>
           <div class="why">${esc(v.a.name)}：${esc(v.whyA||'（未寫原因）')}
             ${v.both?`<br>${esc(v.b.name)}：${esc(v.whyB||'（未寫原因）')}`:''}</div>
         </div>`).join('')}</div>`
        :`<p class="relempty">內容已收起，按「👁️ 顯示」才看得到（${R.avoid.length} 對）</p>`)
      :'<p class="relempty">沒有人提出要避免同組 🎉</p>'}
      <p class="relnote">分組時這一條權重最高，幾乎等於硬性條件。學生私下寫給你的，請勿公開或轉述。</p>
    </div>

    ${noOne.length?`<div class="note bad"><b>沒有被任何人點名的同學（${noOne.length} 位）</b>
      <div class="miss">${noOne.map(x=>`<span>${x.e.seat} ${esc(x.e.name)}</span>`).join('')}</div>
      兩個樂園都沒有人選到他們，分組時記得多留意。</div>`:''}

const csvCell=v=>{const s=String(v??'');return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
const toCSV=rows=>'﻿'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
function rawCSV(){
  const entries=SEATS.map(s=>state.roster[s]).filter(Boolean);
  const gmap={};
  PARK_LIST.forEach(p=>{gmap[p.key]={};
    ensureGroups(p.key,entries).forEach((g,i)=>g.forEach(s=>gmap[p.key][s]=i+1));});
  const rows=[['座號','姓名','膽量(1-5)','喜歡的設施類型','九族想一起玩','劍湖山想一起玩','想避免同組＋原因（保密）','備註','九族分組','劍湖山分組']];
  entries.forEach(e=>rows.push([e.seat,e.name,e.courage,
    e.cats.map(c=>CAT_OF[c].name).join('、'),
    e.mates.nine.map(s=>NAME_OF[s]).join('、'),
    e.mates.jan.map(s=>NAME_OF[s]).join('、'),
    e.avoid.map(s=>NAME_OF[s]+'：'+(e.why[s]||'（未寫原因）')).join('\n'),
    e.note, gmap.nine[e.seat]||'', gmap.jan[e.seat]||'']));
  STUDENTS.filter(([s])=>!state.roster[s]).forEach(([s,n])=>rows.push([s,n,'','','','','','（未填寫）','','']));
  return toCSV(rows);
}
function groupsCSV(){
  const entries=SEATS.map(s=>state.roster[s]).filter(Boolean);
  const byS=Object.fromEntries(entries.map(e=>[e.seat,e]));
  const rows=[['樂園','組別','人數','組長','成員','平均膽量','共同喜好類型','全組都想玩','玩伴心願達成','需老師微調','建議路線']];
  PARK_LIST.forEach(p=>groupMembers(ensureGroups(p.key,entries),byS).forEach((g,i)=>{
    const info=groupInfo(g,p.key);
    rows.push([p.name,'第'+(i+1)+'組',g.length,
      g.length?g[0].seat+' '+g[0].name:'',
      g.map((m,mi)=>m.seat+' '+m.name+(mi===0?'（組長）':'')).join('、'),
      info.avg.toFixed(1), info.main.map(c=>CAT_OF[c].name).join('、'),
      info.shared.map(c=>CAT_OF[c].name).join('、'),
      (info.wishTotal?Math.round(info.wish/info.wishTotal*100):100)+'%',
      info.clash?'有 '+info.clash+' 對希望避免同組':'',
      info.plan.map(bk=>CAT_OF[bk.cat].name+'：'+bk.rides.join('、')).join('\n')]);
  }));
  return toCSV(rows);
}
async function offerFile(filename,text,mime){
  try{
    const dl=await window.claude?.use?.('downloads');
    if(dl){await dl.save({filename,data:text});toast('已下載 '+filename);return;}
  }catch(e){if(e&&e.code==='declined'){toast('已取消');return;}}
  try{
    const blob=(text instanceof Blob)?text:new Blob([text],{type:mime||'text/csv;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);
    a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);
    toast('已下載 '+filename);
  }catch(e){toast('下載失敗，請改用其他瀏覽器');}
}

/* ============ 分組圖（PNG） ============ */
const POSTER_COLORS=['#FF5B6E','#FFC43D','#19BFA8','#2F9BE8','#8A6BE0','#FF8F3C','#FF7FB4'];
const CAT_HEX={thrill:'#E03A50',water:'#1F7FC9',horror:'#6F52C9',gentle:'#0E9B88',
  scenic:'#D65893',culture:'#D4730F',food:'#B8860B'};
const PFONT='"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif';
function rr(ctx,x,y,w,h,r){
  ctx.beginPath();
  if(ctx.roundRect){ctx.roundRect(x,y,w,h,r);return;}
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function wrapTokens(ctx,tokens,maxW,sep='　'){
  const out=[];let line='';
  tokens.forEach(t=>{
    const trial=line?line+sep+t:t;
    if(ctx.measureText(trial).width>maxW&&line){out.push(line);line=t;}
    else line=trial;
  });
  if(line)out.push(line);
  return out.length?out:['—'];
}
function wrapLines(ctx,text,maxW){
  const out=[];let line='';
  for(const ch of String(text)){
    if(ctx.measureText(line+ch).width>maxW&&line){out.push(line);line=ch;}
    else line+=ch;
  }
  if(line)out.push(line);
  return out;
}
async function downloadPoster(park){
  const p=PARKS[park];
  const entries=SEATS.map(s=>state.roster[s]).filter(Boolean);
  if(entries.length<2){toast('還沒有足夠的資料可以產圖');return;}
  const byS=Object.fromEntries(entries.map(e=>[e.seat,e]));
  const gs=groupMembers(ensureGroups(park,entries),byS).filter(g=>g.length);
  try{await document.fonts.ready;}catch(e){}

  const S=2, W=1280, PAD=46, GAP=22;
  const cols=gs.length===1?1:2;
  const cardW=Math.floor((W-PAD*2-GAP*(cols-1))/cols);
  const mk=document.createElement('canvas').getContext('2d');
  // 先算每張卡片的高度
  const metas=gs.map(g=>{
    const info=groupInfo(g,park);
    const blocks=info.plan.map(bk=>{
      mk.font=`500 18px ${PFONT}`;
      return {bk, lines:wrapTokens(mk,bk.rides,cardW-60,'、')};
    });
    const planH=blocks.reduce((t,b)=>t+24+b.lines.length*25+6,0);
    mk.font=`700 17px ${PFONT}`;
    const tagLines=wrapTokens(mk,info.main.map(c=>CAT_OF[c].emoji+CAT_OF[c].name),cardW-56).length;
    const h=14+56+g.length*40+16+tagLines*26+16+30+planH+18;
    return {g,info,blocks,h,tagLines};
  });
  const rows=[];
  for(let i=0;i<metas.length;i+=cols) rows.push(metas.slice(i,i+cols));
  const rowH=rows.map(r=>Math.max(...r.map(m=>m.h)));
  const HEAD=186, FOOT=52;
  const H=HEAD+rowH.reduce((a,b)=>a+b+GAP,0)-GAP+FOOT+PAD;

  const cv=document.createElement('canvas');
  cv.width=W*S; cv.height=H*S;
  const c=cv.getContext('2d'); c.scale(S,S);
  c.textBaseline='alphabetic';

  // 背景
  const bg=c.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#DCF1FF'); bg.addColorStop(.55,'#F4FAFF'); bg.addColorStop(1,'#FFF6E8');
  c.fillStyle=bg; c.fillRect(0,0,W,H);
  // 彩旗
  const tw=W/26;
  for(let i=0;i<26;i++){
    c.fillStyle=POSTER_COLORS[i%POSTER_COLORS.length];
    c.beginPath();c.moveTo(i*tw,0);c.lineTo((i+1)*tw,0);c.lineTo(i*tw+tw/2,26);c.closePath();c.fill();
  }
  // 標題
  c.fillStyle='#2A2140';
  c.font=`800 44px ${PFONT}`;
  c.fillText(`${CLASS_INFO.klass}　${p.name}　分組表`,PAD,100);
  c.font=`500 19px ${PFONT}`;
  c.fillStyle='#6B6189';
  const d=new Date();
  c.fillText(`${CLASS_INFO.school}　${CLASS_INFO.year}　共 ${gs.length} 組 / ${entries.length} 人　｜　`
    +`${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} 製`,PAD,132);
  c.fillStyle=park==='nine'?'#1BAE6B':'#2F9BE8';
  rr(c,PAD,150,W-PAD*2,8,4); c.fill();

  // 卡片
  let y=HEAD;
  rows.forEach((row,ri)=>{
    row.forEach((m,ci)=>{
      const x=PAD+ci*(cardW+GAP), h=rowH[ri], idx=ri*cols+ci;
      const accent=POSTER_COLORS[idx%POSTER_COLORS.length];
      c.fillStyle='#2A2140'; rr(c,x+5,y+6,cardW,h,20); c.fill();      // 立體投影
      c.fillStyle='#FFFFFF'; rr(c,x,y,cardW,h,20); c.fill();
      c.lineWidth=3; c.strokeStyle='#2A2140'; rr(c,x,y,cardW,h,20); c.stroke();
      c.save(); rr(c,x,y,cardW,h,20); c.clip();
      c.fillStyle=accent; c.fillRect(x,y,cardW,12); c.restore();

      let ty=y+54;
      c.fillStyle='#2A2140'; c.font=`800 28px ${PFONT}`;
      c.fillText(`${GROUP_EMOJI[idx%GROUP_EMOJI.length]} 第 ${idx+1} 組`,x+22,ty);
      c.font=`600 17px ${PFONT}`; c.fillStyle='#6B6189';
      const rt=`${m.g.length} 人・膽量 ${m.info.avg.toFixed(1)}`;
      c.fillText(rt,x+cardW-22-c.measureText(rt).width,ty-2);
      ty+=18;

      m.g.forEach((st,mi)=>{
        const isLead=mi===0;
        ty+=40;
        c.fillStyle=isLead?'#FFE49A':'#FFF8EC'; rr(c,x+22,ty-26,cardW-44,34,10); c.fill();
        c.lineWidth=isLead?3:2; c.strokeStyle='#2A2140'; rr(c,x+22,ty-26,cardW-44,34,10); c.stroke();
        c.fillStyle='#6B6189'; c.font=`700 14px ${PFONT}`;
        c.fillText(String(st.seat),x+34,ty-4);
        c.fillStyle='#2A2140'; c.font=`${isLead?'800':'600'} 20px ${PFONT}`;
        c.fillText(st.name,x+64,ty-3);
        if(isLead){
          c.font=`700 15px ${PFONT}`;
          const tag='👑 組長';
          c.fillText(tag,x+cardW-34-c.measureText(tag).width,ty-4);
        }
      });

      ty+=28;
      c.fillStyle='#9A92B4'; c.font=`700 14px ${PFONT}`;
      c.fillText('共同喜好',x+22,ty);
      ty+=8;
      c.fillStyle=accent; c.font=`700 17px ${PFONT}`;
      wrapTokens(c,m.info.main.map(k=>CAT_OF[k].emoji+CAT_OF[k].name),cardW-56)
        .forEach(ln=>{ty+=22;c.fillText(ln,x+22,ty);});

      ty+=30;
      c.fillStyle='#2A2140'; c.font=`800 16px ${PFONT}`;
      c.fillText(`${park==='nine'?'🌿':'🎢'} ${p.name}　建議遊玩設施`,x+22,ty);
      m.blocks.forEach(b=>{
        ty+=24;
        c.fillStyle=CAT_HEX[b.bk.cat]; c.font=`800 15px ${PFONT}`;
        c.fillText(`${CAT_OF[b.bk.cat].emoji} ${CAT_OF[b.bk.cat].name}`,x+22,ty);
        c.fillStyle='#4A4266'; c.font=`500 18px ${PFONT}`;
        b.lines.forEach(ln=>{ty+=25;c.fillText(ln,x+30,ty);});
        ty+=6;
      });
    });
    y+=rowH[ri]+GAP;
  });

  c.fillStyle='#9A92B4'; c.font=`500 16px ${PFONT}`;
  c.fillText('依每個人想玩的設施類型、想一起玩的同學與膽量排出，老師可再調整。設施以園區當日公告為準。',PAD,H-PAD+10);

  const blob=await new Promise(res=>cv.toBlob(res,'image/png'));
  if(!blob){toast('產圖失敗，請換個瀏覽器試試');return;}
  offerFile(`${CLASS_INFO.klass}_${p.name}_分組表.png`,blob,'image/png');
}

/* ============ 事件 ============ */
document.addEventListener('click',async ev=>{
  const b=ev.target.closest('[data-act]'); if(!b||b.tagName==='INPUT') return;
  const a=b.dataset.act, d=state.draft;
  const grabNote=()=>{const n=document.getElementById('noteBox'); if(n) d.note=n.value;};
  const grabWhy=()=>{document.querySelectorAll('.whyin').forEach(t=>{d.why[Number(t.dataset.seat)]=t.value;});};

  if(a==='pickme'){d.seat=Number(b.dataset.seat);
    d.mates.nine=d.mates.nine.filter(s=>s!==d.seat); d.mates.jan=d.mates.jan.filter(s=>s!==d.seat);
    d.avoid=d.avoid.filter(s=>s!==d.seat); delete d.why[d.seat];
    saveDraft();render();}
  else if(a==='courage'){d.courage=Number(b.dataset.v);saveDraft();render();}
  else if(a==='cat'){const id=b.dataset.id;
    d.cats=d.cats.includes(id)?d.cats.filter(x=>x!==id):[...d.cats,id];saveDraft();render();}
  else if(a==='mate'){const p=b.dataset.park,s=Number(b.dataset.seat);
    d.mates[p]=d.mates[p].includes(s)?d.mates[p].filter(x=>x!==s):[...d.mates[p],s];saveDraft();render();}
  else if(a==='avoid'){const s=Number(b.dataset.seat);
    grabWhy();
    if(d.avoid.includes(s)){d.avoid=d.avoid.filter(x=>x!==s);delete d.why[s];}
    else d.avoid=[...d.avoid,s];
    saveDraft();render();}
  else if(a==='whyfill'){grabWhy();d.why[Number(b.dataset.seat)]=b.dataset.text;saveDraft();render();}
  else if(a==='next'){grabNote();grabWhy();state.step=Math.min(6,state.step+1);saveDraft();render();scrollTop();}
  else if(a==='back'){grabNote();grabWhy();state.step=Math.max(0,state.step-1);saveDraft();render();scrollTop();}
  else if(a==='submit'){
    grabNote();
    if(!d.seat||!d.cats.length){toast('請先選名字和至少一種設施類型');return;}
    state.sending=true;render();
    const payload={seat:d.seat,name:NAME_OF[d.seat],courage:d.courage,cats:d.cats.slice(),
      nine:d.mates.nine.slice(),jan:d.mates.jan.slice(),
      avoid:d.avoid.slice(), avoidWhy:d.avoid.map(s=>String(d.why[s]||'').replace(/[|]/g,'／').trim().slice(0,60)),
      note:(d.note||'').slice(0,80),ts:new Date().toISOString()};
    try{
      await sendAnswer(payload);
      state.sent=normalise(payload); lsSet(LS_SENT,state.sent);
      state.sending=false; render(); scrollTop();
    }catch(err){
      state.sending=false; render();
      toast('送出失敗，請確認網路後再按一次');
    }
  }
  else if(a==='redo'){state.sent=null;lsSet(LS_SENT,null);state.step=0;render();scrollTop();}
  else if(a==='toggleView'){
    state.view=state.view==='student'?'teacher':'student';
    state.loadErr=''; render(); scrollTop();
    if(state.view==='teacher'&&!state.unlocked)
      setTimeout(()=>{const el=document.getElementById('lockBox'); if(el) el.focus();},60);
  }
  else if(a==='unlock'){
    const el=document.getElementById('lockBox');
    await unlock(el?el.value.trim():'');
    if(state.unlocked) scrollTop();
  }
  else if(a==='lock'){
    state.unlocked=false; state.roster={}; state.showPrivate=false; state.move=null;
    state.view='student'; state.loadErr=''; lsSet(LS_CACHE,{}); render(); scrollTop();
    toast('已鎖定老師專區');
  }
  else if(a==='size'){const n=b.dataset.n;state.size=(n==='flex'?'flex':Number(n));
    state.groups={nine:null,jan:null};state.move=null;saveGroups();render();}
  else if(a==='togglePrivate'){state.showPrivate=!state.showPrivate;render();}
  else if(a==='regroup'){const p=b.dataset.park;
    const ents=SEATS.map(x=>state.roster[x]).filter(Boolean);
    const byS2=Object.fromEntries(ents.map(e=>[e.seat,e]));
    if(state.groups[p]) POOL[p].seen.add(signature(groupMembers(state.groups[p],byS2)));
    state.regen[p]={seed:Math.floor(Math.random()*1e9)};
    state.move=null;
    b.disabled=true; b.textContent='重新分組中⋯';
    setTimeout(()=>{state.groups[p]=null;saveGroups();render();toast(PARKS[p].name+'已重新自動分組');},30);}
  else if(a==='addgroup'){const p=b.dataset.park;
    if(!state.groups[p]) return; state.groups[p].push([]);saveGroups();render();}
  else if(a==='pickmember'){const p=b.dataset.park,s=Number(b.dataset.seat);
    state.move=(state.move&&state.move.seat===s&&state.move.park===p)?null:{park:p,seat:s};render();}
  else if(a==='cancelmove'){state.move=null;render();}
  else if(a==='moveto'){
    const p=b.dataset.park, gi=Number(b.dataset.gi), mv=state.move;
    if(!mv||mv.park!==p) return;
    const gs=state.groups[p];
    if(gs[gi].includes(mv.seat)){state.move=null;render();return;}
    if(gs[gi].length>=GMAX){toast(`一組最多 ${GMAX} 人，請先把這組的人移走`);return;}
    {                                             // 不能把不想同組的人放在一起
      const me=state.roster[mv.seat];
      const bad=gs[gi].filter(s=>s!==mv.seat&&state.roster[s]&&me&&APART(me,state.roster[s]));
      if(bad.length){toast(`不能移過去：${NAME_OF[mv.seat]} 和 ${bad.map(s=>NAME_OF[s]).join('、')} 有人表示不想同組`);return;}
    }
    gs.forEach(g=>{const k=g.indexOf(mv.seat); if(k>=0) g.splice(k,1);});
    gs[gi].push(mv.seat);
    state.groups[p]=gs.filter((g,i)=>g.length||i===gi);   // 搬空的組自動消失
    state.move=null; saveGroups(); render();
  }
  else if(a==='delgroup'){const p=b.dataset.park,gi=Number(b.dataset.gi);
    if(state.groups[p]&&!state.groups[p][gi].length){state.groups[p].splice(gi,1);saveGroups();render();}}
  else if(a==='poster'){downloadPoster(b.dataset.park);}
  else if(a==='reload'){ if(!state.key){toast('請先輸入老師密碼');return;} loadRoster();}
  else if(a==='clear'){
    if(b.dataset.sure){state.roster={};lsSet(LS_CACHE,{});render();toast('已清空畫面資料（雲端資料不受影響）');}
    else{b.dataset.sure='1';b.textContent='再按一次確認';
      setTimeout(()=>{if(b.isConnected){delete b.dataset.sure;b.textContent='清空目前畫面資料';}},4000);}
  }
  else if(a==='csvRaw'){offerFile(`${CLASS_INFO.klass}_玩伴調查_原始資料.csv`,rawCSV());}
  else if(a==='csvGroups'){offerFile(`${CLASS_INFO.klass}_玩伴分組結果.csv`,groupsCSV());}
});
document.addEventListener('change',ev=>{
  if(ev.target.dataset && ev.target.dataset.act==='leader'){
    const p=ev.target.dataset.park, gi=Number(ev.target.dataset.gi), s=Number(ev.target.value);
    const g=state.groups[p] && state.groups[p][gi];
    if(g && g.includes(s)){                       // 組長＝陣列第一位
      state.groups[p][gi]=[s,...g.filter(x=>x!==s)];
      saveGroups(); render();
      toast(NAME_OF[s]+' 成為第 '+(gi+1)+' 組組長');
    }
    return;
  }
  if(ev.target.dataset && ev.target.dataset.act==='importcsv'){
    const f=ev.target.files&&ev.target.files[0]; if(!f) return;
    const fr=new FileReader();
    fr.onload=()=>{
      const rows=parseCSV(String(fr.result));
      if(!rows.length){toast('檔案是空的');return;}
      const head=rows[0].map(h=>h.trim());
      const col=n=>head.indexOf(n);
      const iSeat=col('座號'),iC=col('膽量'),iCat=col('喜歡類型'),iN=col('九族玩伴'),iJ=col('劍湖山玩伴'),
            iA=col('避免同組'),iW=col('原因'),iNote=col('備註');
      if(iSeat<0){toast('找不到「座號」欄，請確認是試算表匯出的 CSV');return;}
      let n=0;
      rows.slice(1).forEach(r=>{
        const e=normalise({seat:r[iSeat],courage:r[iC],
          cats:String(r[iCat]||'').split('|').filter(Boolean),
          nine:String(r[iN]||'').split('|').filter(Boolean),
          jan:String(r[iJ]||'').split('|').filter(Boolean),
          avoid:String(iA>=0?r[iA]||'':'').split('|').filter(Boolean),
          avoidWhy:String(iW>=0?r[iW]||'':'').split('|'), note:r[iNote]||''});
        if(e){state.roster[e.seat]=e;n++;}
      });
      lsSet(LS_CACHE,state.roster);
      toast(n?`匯入 ${n} 筆`:'沒有可用的資料列');
    };
    fr.readAsText(f,'utf-8');
    ev.target.value='';
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='noteBox'){state.draft.note=e.target.value;saveDraft();}
  if(e.target.id==='lockBox'&&state.loadErr){state.loadErr='';
    const n=document.querySelector('.lock .note.bad'); if(n) n.remove();}
  if(e.target.classList && e.target.classList.contains('whyin')){
    state.draft.why[Number(e.target.dataset.seat)]=e.target.value; saveDraft();
    // 不重繪（會失焦），直接切換「下一步」的狀態
    const ok=state.draft.avoid.every(s=>String(state.draft.why[s]||'').trim().length>=2);
    const nx=document.querySelector('[data-act="next"]'); if(nx) nx.disabled=!ok;
    const warn=document.querySelector('.note.bad'); if(warn) warn.hidden=ok;
  }
});
document.addEventListener('keydown',async e=>{
  if(e.key==='Enter'&&e.target&&e.target.id==='lockBox'){
    e.preventDefault(); await unlock(e.target.value.trim());
    if(state.unlocked) scrollTop();
  }
});
function scrollTop(){try{window.scrollTo({top:0,behavior:'smooth'});}catch(e){window.scrollTo(0,0);}}

render();
</script>
